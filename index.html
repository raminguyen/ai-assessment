<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Essay Explorer - Rami's Research Tool</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Main Container -->
    <div class="main-container">
        <!-- Left Panel -->
        <div class="left-panel">
            <button class="load-btn" id="githubBtn">Load from GitHub</button>

            <!-- Assignment Filter -->
            <div class="assignment-filter">
                <button class="filter-btn active" data-assignment="a1"> Catlove Case Study</button>
                <button class="filter-btn" data-assignment="a2">Social Spending & Economic Growth</button>
                <button class="filter-btn" data-assignment="a3">Real Estate Analysis </button>
            </div>

            <!-- Assignment Section -->
            <div class="assignment-section" data-assignment="a1">
                <h2 class="assignment-title">Critical Thinking</h2>

                <div class="model-group">
                    <h3 class="model-name">ChatGPT</h3>
                    <div class="button-row">
                        <button class="action-btn" data-model="chatgpt" data-type="generation">Generation</button>
                        <button class="action-btn" data-model="chatgpt" data-type="tuning">Tuning</button>
                        <button class="action-btn" data-model="chatgpt" data-type="reflection">Reflection</button>
                    </div>
                </div>

                <div class="model-group">
                    <h3 class="model-name">Gemini</h3>
                    <div class="button-row">
                        <button class="action-btn" data-model="gemini" data-type="generation">Generation</button>
                        <button class="action-btn" data-model="gemini" data-type="tuning">Tuning</button>
                        <button class="action-btn" data-model="gemini" data-type="reflection">Reflection</button>
                    </div>
                </div>

                <div class="model-group">
                    <h3 class="model-name">Claude</h3>
                    <div class="button-row">
                        <button class="action-btn" data-model="claude" data-type="generation">Generation</button>
                        <button class="action-btn" data-model="claude" data-type="tuning">Tuning</button>
                        <button class="action-btn" data-model="claude" data-type="reflection">Reflection</button>
                    </div>
                </div>

                <div class="model-group">
                    <h3 class="model-name">Grok</h3>
                    <div class="button-row">
                        <button class="action-btn" data-model="grok" data-type="generation">Generation</button>
                        <button class="action-btn" data-model="grok" data-type="tuning">Tuning</button>
                        <button class="action-btn" data-model="grok" data-type="reflection">Reflection</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Center Panel -->
        <div class="center-panel">
            <div class="date-display" id="dateDisplay">Date: --</div>

            <div class="prompt-section">
                <h3 class="section-label">Prompt</h3>
                <div class="prompt-content" id="promptContent">
                    Select an item from the left panel to view details
                </div>
            </div>

            <div class="rubric-section" id="rubricSection" style="display: none;">
                <h3 class="section-label">Rubric</h3>
                <div class="rubric-content" id="rubricContent"></div>
            </div>

            <div class="response-section">
                <h3 class="section-label">Response</h3>
                <div class="response-content" id="responseContent">
                    Select an item to view the response
                </div>
            </div>
        </div>

        <!-- Right Panel -->
        <div class="right-panel">
            <div class="score-table" id="scoreTable">
                <div class="score-header">
                    <span>Scores</span>
                </div>
                <div class="score-body" id="scoreBody">
                    <!-- Scores will be populated here -->
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <div class="footer-left">
            © Dec 2025 Developed by Rami Huu Nguyen - AI Researcher 
        </div>
        <div class="footer-right">
            <a href="https://www.linkedin.com/in/raminguyen/" target="_blank">LinkedIn</a>
            <span class="footer-spacer"></span>
            <span class="footer-spacer"></span>
            <a href="mailto:raminguyen.12@gmail.com">Email</a>
        </div>
    </footer>

    <!-- Scripts - Load in order -->
    <!-- Core Data & Utilities -->
    <script src="src/js/data.js"></script>
    <script src="src/js/parser.js"></script>
    <script src="src/js/data-processor.js"></script>

    <!-- UI Components -->
    <script src="src/js/element.js"></script>
    <script src="src/js/filter.js"></script>
    <script src="src/js/renderer.js"></script>

    <!-- Data Loaders -->
    <script src="src/js/github-loader.js"></script>

    <!-- Application Entry -->
    <script src="src/js/application.js"></script>
</body>
</html>
