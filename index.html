    <!-- Scripts - Load in order -->

    <script src="src/js/renderer.js?v=17"></script>

    <!-- Unified GitHub Loader (replaces all github-loader-pN.js files) -->
    <script>
        async function loadFromGitHub() {
            const folder = 'critical_thinking';
            const suffix = '_p' + (window.PROMPT_NUMBER || '0') + '.json';
            let totalLoaded = 0;

            const treeUrl = 'https://api.github.com/repos/raminguyen/ai-assessment/git/trees/main?recursive=1';
            const rawBase = 'https://raw.githubusercontent.com/raminguyen/ai-assessment/main/';

            const response = await fetch(treeUrl);
            if (!response.ok) return totalLoaded;

            const treeData = await response.json();

            const jsonFiles = treeData.tree.filter(function(item) {
                return item.type === 'blob' &&
                       item.path.startsWith('data/' + folder + '/') &&
                       item.path.endsWith(suffix);
            });

            for (const file of jsonFiles) {
                const fileName = file.path.split('/').pop();
                const cacheBuster = '?t=' + Date.now();
                const fileResponse = await fetch(rawBase + file.path + cacheBuster);
                const fileText = await fileResponse.text();

                try {
                    const data = JSON.parse(fileText);
                    processData(data, folder, fileName);
                    totalLoaded++;
                } catch (error) {
                    console.error('JSON parse error in file:', fileName);
                    console.error('Error:', error.message);
                    throw error;
                }
            }

            return totalLoaded;
        }
    </script>

    <script src="src/js/local-loader.js?v=10"></script>

    <!-- Default prompt: p0 -->
    <script>
        window.PROMPT_NUMBER = '0';
    </script>

    <!-- Application Entry -->
    <script src="src/js/application.js?v=11"></script>

    <!-- Prompt Tab Switching -->
    <script>
        document.querySelectorAll('.prompt-tab').forEach(function(tab) {
            tab.addEventListener('click', async function() {
                var num = this.getAttribute('data-prompt');
                if (num === window.PROMPT_NUMBER) return;

                // Update active tab
                document.querySelectorAll('.prompt-tab').forEach(function(t) {
                    t.classList.remove('active');
                });
                this.classList.add('active');

                // Update prompt number and clear data
                window.PROMPT_NUMBER = num;
                clearData();

                // Reset UI
                document.getElementById('promptContent').textContent = 'Select an item from the left panel to view details';
                document.getElementById('responseContent').textContent = 'Select an item to view the response';
                document.getElementById('scoreBody').innerHTML = '';
                document.getElementById('rubricSection').style.display = 'none';
                document.getElementById('dateDisplay').textContent = 'Date: --';
                document.getElementById('scoreModal').style.display = 'none';

                // Remove active from action buttons
                document.querySelectorAll('.action-btn').forEach(function(btn) {
                    btn.classList.remove('active');
                });

                // Re-initialize renderer with new prompt
                await initRenderer(num);
            });
        });
    </script>
